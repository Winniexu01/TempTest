parameters:
- name: PowerShellVersion
  type: string
  default: '7.5.5'

name: $(date:yyyyMMdd)$(rev:.r)

trigger: none
pr: none
pool:
  vmImage: 'windows-latest'
stages:
- stage: stage
  displayName: 'Console App 1'
  jobs:
  - job: Phase_1
    displayName: TempTest
    steps:
    - task: PowerShell@2
      displayName: Check PowerShell Version (Before Installing PowerShell ${{ parameters.PowerShellVersion }})
      inputs:
        pwsh: true
        targetType: inline
        script: |
          Write-Host "Before installing PowerShell"
          $PSVersionTable.PSVersion
          (Get-Command pwsh).Source
    - task: PowerShell@2
      displayName: Install PowerShell ${{ parameters.PowerShellVersion }}
      inputs:
        pwsh: false
        targetType: inline
        script: |
          try {
            Write-Host "Installing PowerShell ${{ parameters.PowerShellVersion }} via winget (pipeline output suppressed)..."
            $ver = "${{ parameters.PowerShellVersion }}"
            $msi = "PowerShell-$ver-win-x64.msi"
            $url = "https://github.com/PowerShell/PowerShell/releases/download/v$ver/$msi"
            $dst = Join-Path $env:AGENT_TEMPDIRECTORY $msi

            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dst

            Write-Host "Installing $msi"
            Start-Process msiexec.exe -Wait -ArgumentList @("/i", "`"$dst`"", "/qn", "/norestart")
          }
          catch {
            Write-Warning "winget command failed: $_"
            $global:LASTEXITCODE = 0
          }
    - task: PowerShell@2
      displayName: Check PowerShell Version (After Installing PowerShell ${{ parameters.PowerShellVersion }})
      inputs:
        pwsh: true
        targetType: inline
        script: |
          Write-Host "Checking PowerShell Version after installation"
          (Get-Command pwsh).Source
          $requiredVersionText = "${{ parameters.PowerShellVersion }}"
          $requiredVersion = [System.Management.Automation.SemanticVersion]$requiredVersionText
          $currentVersion = $PSVersionTable.PSVersion

          Write-Host "Required PowerShell version: $requiredVersion"
          Write-Host "Current PowerShell version:  $currentVersion"

          # Compare Major.Minor.Patch to avoid Revision mismatches from platform differences.
          $isMatch = (
            $currentVersion.Major -eq $requiredVersion.Major -and
            $currentVersion.Minor -eq $requiredVersion.Minor -and
            $currentVersion.Patch -eq $requiredVersion.Patch
          )

          if (-not $isMatch) {
            throw "PowerShell version mismatch. Required: $requiredVersion, Current: $currentVersion"
          }

          Write-Host "PowerShell version check passed."