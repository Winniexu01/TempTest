parameters:
- name: KEYWORDS
  type: string
  displayName: 'Keywords for Xcode monitoring (comma-separated)'
  default: 'Xcode'
- name: VSEngMailerVersion
  type: string
  displayName: 'Version of VSEngMailer (e.g., 1.0.*; default - latest).'
  default: '*'

variables:
- name: WorkflowExe
  value: $(Build.SourcesDirectory)\src\QueueBuild\QueueBuild\bin\Release\QueueBuild.exe

name: $(date:yyyyMMdd)$(rev:.r)

trigger: none
pr: none

pool:
  vmImage: 'windows-latest'
stages:
- stage: stage
  displayName: 'DDFinalize-Test'
  jobs:
  - job: Phase_1
    timeoutInMinutes: 120
    displayName: Phase_1
    steps:
    - checkout: self
      clean: true
      persistCredentials: true

    - task: NuGetToolInstaller@1
      displayName: 'Use NuGet'
      inputs:
        checkLatest: true

    - task: NuGetCommand@2
      displayName: 'Restore Nuget Packages'
      inputs:
        restoreSolution: '$(Build.SourcesDirectory)\src\QueueBuild\QueueBuild.slnx'
        feedsToUse: 'config'
        nugetConfigPath: Nuget.config
        includeNuGetOrg: false
      continueOnError: false

    - task: MSBuild@1
      displayName: 'Build Workflow Executable'
      inputs:
        solution: '$(Build.SourcesDirectory)\src\QueueBuild\QueueBuild.slnx'
        configuration: Release
        clean: true
      continueOnError: false

    - task: PowerShell@2
      displayName: 'Verify Build Workflow Executable'
      continueOnError: false
      inputs:
        targetType: 'inline'
        script: |
          $workflowExe = "$(WorkflowExe)"
          Write-Host "Checking for workflow executable at: $workflowExe"
          if (-not (Test-Path $workflowExe))
          {
            Write-Error "Workflow executable not found: $workflowExe"
            exit 1
          }

          Write-Host "Workflow executable found: $workflowExe"
          Get-ChildItem $workflowExe | Format-Table Name, Length, LastWriteTime
        workingDirectory: '$(Build.SourcesDirectory)'

    - task: AzureCLI@2
      displayName: 'Get AccessToken of Winniexu01'
      inputs:
        azureSubscription: Winniexu01
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $accessToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query "accessToken" --output tsv

          if(-not $accessToken) 
          {
            Write-Error "The accessToken of Winniexu01 is null or empty!"
          }
          else
          {
            Write-Host "The accessToken of Winniexu01 is obtained."
          }

          Write-Host "##vso[task.setvariable variable=ACCESSTOKEN]$accessToken"
      continueOnError: false

    - task: CmdLine@2
      displayName: 'Finalize Build'
      inputs:
        script: '"$(WorkflowExe)"'
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        SYSTEM_ACCESSTOKEN: $env:ACCESSTOKEN